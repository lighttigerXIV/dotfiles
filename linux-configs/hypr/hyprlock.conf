general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
	path = ~/Pictures/wallpapers/black-hole.jpg
	blur_passes = 1
    blur_size = 4
}

input-field {
    monitor =
    size = 320, 48
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 64
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgb(56, 56, 56)
    inner_color = rgb(20, 20, 20)
    font_color = rgb(242, 242, 242)

    fade_on_empty = false
    placeholder_text = Password
    hide_input = false
    check_color = rgb(255, 173, 114)
    fail_color = rgb(255, 114, 114)
    fail_text = Sounds like a skill issue!!
    capslock_color = rgb(255, 222, 114)
}
